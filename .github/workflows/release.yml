name: Build & Release

# PR 合并到 main 后：编译 + 打包 + 发布 Release（版本号取自仓库根目录的 VERSION 文件）。
# 标签 v<VERSION> 已存在时跳过，不重复发布。
on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 仓库不提交 Gradle wrapper，由 setup-gradle 提供固定版本的 gradle 命令
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate project layout
        run: |
          set -e
          for f in settings.gradle.kts build.gradle.kts gradle.properties VERSION; do
            test -f "$f" || { echo "::error::$f not found"; exit 1; }
          done
          for m in faker monitor; do
            test -f "$m/src/main/assets/xposed_init" || { echo "::error::$m xposed_init not found"; exit 1; }
            grep -q 'xposedmodule' "$m/src/main/AndroidManifest.xml" || { echo "::error::$m is not an Xposed module"; exit 1; }
          done

      - name: Read version
        id: version
        run: |
          set -e
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found in repository root"
            exit 1
          fi

          RAW=$(tr -d '[:space:]' < VERSION)
          if [ -z "$RAW" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi

          if ! echo "$RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION '$RAW' is not a valid semver"
            exit 1
          fi

          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"
          echo "Version: $RAW"

      - name: Check existing tag
        id: check
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist; will release."
          fi

      - name: Save PR body
        if: steps.check.outputs.exists == 'false'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          mkdir -p build
          if [ -z "$PR_BODY" ]; then
            printf '_No description provided._\n' > build/PR_BODY.md
          else
            printf '%s\n' "$PR_BODY" > build/PR_BODY.md
          fi

      - name: Build release APKs
        if: steps.check.outputs.exists == 'false'
        run: gradle --no-daemon :faker:assembleRelease :monitor:assembleRelease -PversionName="${{ steps.version.outputs.raw }}" -PversionCode="${{ github.run_number }}"

      - name: Package APKs
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          RAW="${{ steps.version.outputs.raw }}"
          rm -rf build/out
          mkdir -p build/out

          FAKER=$(find faker/build/outputs/apk/release -name '*.apk' | head -n 1)
          MONITOR=$(find monitor/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$FAKER" || { echo "::error::Faker APK was not produced"; exit 1; }
          test -n "$MONITOR" || { echo "::error::Monitor APK was not produced"; exit 1; }

          cp "$FAKER" "build/out/FakeGXZQ-Faker-$RAW-unsigned.apk"
          cp "$MONITOR" "build/out/FakeGXZQ-Monitor-$RAW-unsigned.apk"

          ls -lh build/out

      - name: Calculate SHA256
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          ( cd build/out && sha256sum *.apk > SHA256.txt )
          cat build/out/SHA256.txt

          {
            echo ""
            echo "---"
            echo ""
            echo "### SHA256"
            echo ""
            echo '```text'
            cat build/out/SHA256.txt
            echo '```'
          } >> build/PR_BODY.md

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "FakeGXZQ ${{ steps.version.outputs.tag }}"
          body_path: build/PR_BODY.md
          files: |
            build/out/FakeGXZQ-Faker-${{ steps.version.outputs.raw }}-unsigned.apk
            build/out/FakeGXZQ-Monitor-${{ steps.version.outputs.raw }}-unsigned.apk
            build/out/SHA256.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.raw, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
